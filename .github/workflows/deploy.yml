name: Deploy to GitHub Pages

# Rebuilds and redeploys on every push to the default branch, and can be run
# by hand from the Actions tab. No scheduled runs.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fetches GitHub data (profile, repos, READMEs) and precompiles the
      # README markdown to HTML. Without the token secret the build falls back
      # to the mocks in src/data/.
      - name: Fetch GitHub data and render READMEs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ ! -f scripts/refresh-projects.ts ]; then
            echo "::notice::No token or refresh script yet - building with mock data."
            exit 0
          fi
          npm run refresh

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
